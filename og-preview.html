<!doctype html>
<html><head><meta charset="utf-8">
<title>OG Image Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#071728;--navy-mid:#0E2640;--gold:#C8973C;--gold-light:#E4B96A;--cream:#FAF7F2;--muted:#9FB1C6}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#111}
  .card{width:1200px;height:630px;overflow:hidden;position:relative;margin:0 auto;
    background:radial-gradient(120% 140% at 0% 0%,var(--navy-mid) 0%,var(--navy) 60%);
    font-family:'Playfair Display',Georgia,serif;color:var(--cream)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(200,151,60,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(200,151,60,.06) 1px,transparent 1px);background-size:60px 60px}
  .photo{position:absolute;right:0;top:0;width:460px;height:630px;background:url('headshot.webp') center 18%/cover no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 32%);mask-image:linear-gradient(90deg,transparent 0%,#000 32%)}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(7,23,40,.85) 100%)}
  .bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--gold)}
  .content{position:absolute;left:80px;top:78px;width:700px}
  .eyebrow{font-family:'Outfit',sans-serif;font-size:20px;letter-spacing:5px;text-transform:uppercase;color:var(--gold-light);display:flex;align-items:center;gap:16px}
  .eyebrow::before{content:"";width:48px;height:2px;background:var(--gold)}
  h1{font-size:104px;line-height:1;font-weight:700;margin-top:30px;letter-spacing:-1px}
  h1 .dot{color:var(--gold)}
  .role{font-size:38px;font-style:italic;font-weight:600;color:var(--gold-light);margin-top:14px}
  .stats{display:flex;gap:44px;margin-top:44px;font-family:'Outfit',sans-serif}
  .stat b{display:block;font-family:'Playfair Display',serif;font-size:46px;color:var(--gold);font-weight:700;line-height:1}
  .stat span{display:block;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .foot{position:absolute;left:80px;bottom:54px;font-family:'Outfit',sans-serif;font-size:24px;display:flex;gap:18px;align-items:center}
  .foot .url{color:var(--gold-light);font-weight:600;letter-spacing:1px}
  .foot .sep{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .foot .muted{color:var(--muted)}
</style></head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="photo"></div>
  <div class="bar"></div>
  <div class="content">
    <div class="eyebrow">Facilities &amp; Community Management</div>
    <h1>Raneesh<span class="dot">.</span></h1>
    <div class="role">Senior FM &amp; Community Manager</div>
    <div class="stats">
      <div class="stat"><b>20+</b><span>Years GCC &amp; India</span></div>
      <div class="stat"><b>37K+</b><span>Assets Managed</span></div>
      <div class="stat"><b>CAFM</b><span>Digital FM</span></div>
    </div>
  </div>
  <div class="foot"><span class="url">raneesh.net</span><span class="sep"></span><span class="muted">Dubai, UAE</span></div>
</div>
</body></html>
